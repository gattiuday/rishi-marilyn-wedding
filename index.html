        /* Timeline Styles */

<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // ==========================================
        // FIREBASE CONFIGURATION - UPDATE THESE KEYS
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase safely (will fail gracefully if keys are placeholder)
        let app, database, auth;
        try {
            if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
                app = initializeApp(firebaseConfig);
                database = getDatabase(app);
                auth = getAuth(app);
            }
        } catch (e) {
            console.error("Firebase Initialization Error:", e);
        }

        // Expose Firebase instances globally for React to use
        window.firebaseDb = database;
        window.firebaseAuth = auth;
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { MapPin, Clock, Heart, ChefHat, Wine, Bed, Plane, CheckCircle, Users, LogOut, Lock } from 'lucide-react';
        import { push, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // ==========================================
        // COMPONENTS
        // ==========================================

        function HeroSection() {
            return (
                <div className="relative min-h-screen flex flex-col items-center justify-start p-4 pt-[300px] pb-20 fade-in overflow-hidden bg-transparent">
                    <div className="absolute top-0 left-0 w-full z-0 opacity-100 pointer-events-none">
                        <img src="./garland.png" alt="Floral Garland" className="w-full h-[200px] object-cover object-top opacity-80" />
                    </div>

                    <div className="relative z-10 max-w-lg w-full text-center mt-0">
                        <div className="mb-8">
                            <span className="font-cinzel text-xs tracking-[0.3em] uppercase text-slate-500">Welcome to our wedding invite</span>
                            <h1 className="font-playfair text-5xl md:text-6xl mt-2 leading-tight text-slate-800 italic">Our Wedding</h1>
                            <div className="mt-8 font-script text-6xl md:text-7xl text-slate-800 drop-shadow-sm">
                                Rishi & Marilyn
                            </div>
                        </div>

                        <div className="glass-panel rounded-2xl p-8 md:p-12 relative mt-28">
                            <div className="absolute -top-24 left-1/2 transform -translate-x-1/2 w-40 h-40 rounded-full border-8 border-white shadow-xl overflow-hidden bg-white z-20">
                                <img src="./couple_portrait.png" alt="The Couple" className="w-full h-full object-cover" />
                            </div>

                            <div className="mt-12 mb-6">
                                <h2 className="text-xl text-slate-600 mb-2 font-montserrat">Saturday</h2>
                                <p className="font-playfair text-4xl text-slate-900 mb-2">September 19, 2026</p>
                            </div>

                            <div className="mb-10 px-4 text-sm text-slate-600 leading-relaxed max-w-md mx-auto italic font-playfair border-t border-b border-slate-200 py-6">
                                "We are overjoyed to invite you to share in our happiness as we unite in marriage. Your presence will make our day truly complete."
                            </div>

                            <a href="#rsvp" className="inline-block bg-slate-800 hover:bg-slate-700 text-white px-8 py-3 rounded-full font-cinzel text-xs tracking-widest uppercase transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5">
                                RSVP Now
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        function ScheduleSection() {
            const events = [
                { time: "2:00 PM", title: "Ceremony", desc: "St. Peter the Apostle", icon: Heart },
                { time: "6:00 PM - 7:00 PM", title: "Cocktail Hour", desc: "Il Villaggio", icon: Wine },
                { time: "7:00 PM - 11:00 PM", title: "Reception", desc: "Il Villaggio", icon: ChefHat },
            ];

            return (
                <div id="schedule" className="py-24 px-4 bg-transparent relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full opacity-20 pointer-events-none z-0">
                        <img src="./garland.png" alt="" className="w-full h-[200px] object-cover object-top" />
                    </div>
                    <div className="max-w-4xl mx-auto text-center relative z-10">
                        <h2 className="font-playfair text-4xl text-slate-800 italic mb-16">Schedule of Events</h2>
                        
                        <div className="relative">
                            <div className="timeline-line hidden md:block"></div>
                            <div className="space-y-12">
                                {events.map((event, idx) => (
                                    <div key={idx} className={`relative flex flex-col md:flex-row items-center ${idx % 2 === 0 ? 'md:flex-row-reverse' : ''}`}>

                                                <p className="font-cinzel text-sm text-slate-500 font-bold mb-2">{event.time}</p>

                                        </div>
                                        <div className="md:w-1/2 p-4 hidden md:block"></div>

                                ))}
                            </div>
                        </div>
                    </div>

            );
        }

        function DetailsTravelSection() {
            return (
                <div id="travel" className="bg-transparent py-24 px-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <h2 className="font-playfair text-4xl text-slate-800 italic">Travel & Details</h2>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                            {/* Ceremony */}
                            <div className="glass-panel p-8 rounded-2xl text-center">
                                <MapPin className="w-8 h-8 text-slate-600 mx-auto mb-4" />
                                <h3 className="font-cinzel font-bold text-sm tracking-wider uppercase mb-3">Ceremony</h3>
                                <p className="font-playfair text-xl text-slate-900 mb-2">St. Peter the Apostle</p>
                                <p className="text-slate-600 text-sm mb-4">94 Somerset St<br/>New Brunswick, NJ 08901</p>
                            </div>

                            {/* Reception */}
                            <div className="glass-panel p-8 rounded-2xl text-center">
                                <Wine className="w-8 h-8 text-slate-600 mx-auto mb-4" />
                                <h3 className="font-cinzel font-bold text-sm tracking-wider uppercase mb-3">Reception</h3>
                                <p className="font-playfair text-xl text-slate-900 mb-2">Il Villaggio</p>
                                <p className="text-slate-600 text-sm mb-4">651 NJ-17 N<br/>Carlstadt, NJ 07072</p>
                            </div>


                        </div>
                    </div>
                </div>
            );
        }

        function RsvpSection() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                attending: 'yes',
                guests: '1',
                meal: 'beef',
                dietary: ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setErrorMsg('');
                
                try {
                    if (window.firebaseDb) {
                        const rsvpRef = ref(window.firebaseDb, 'rsvps');
                        await push(rsvpRef, {
                            ...formData,
                            timestamp: new Date().toISOString()
                        });
                        setIsSuccess(true);
                    } else {
                        // Mock submission if Firebase is not configured
                        console.warn("Firebase not configured. Mocking submission.");
                        setTimeout(() => setIsSuccess(true), 1000);
                    }
                } catch (error) {
                    console.error("Error submitting RSVP:", error);
                    setErrorMsg("There was an error saving your RSVP. Please try again.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div id="rsvp" className="py-24 px-4 bg-transparent relative overflow-hidden">
                    <div className="absolute bottom-0 left-0 w-full opacity-40 pointer-events-none transform rotate-180 z-0">
                        <img src="./garland.png" alt="" className="w-full h-[200px] object-cover object-top" />
                    </div>

                    <div className="max-w-2xl mx-auto relative z-10">
                        <div className="text-center mb-12">
                            <h2 className="font-playfair text-4xl text-slate-800 italic mb-4">RSVP</h2>
                            <p className="font-cinzel text-xs tracking-widest text-slate-500 uppercase">Please respond by August 19th</p>
                        </div>

                        <div className="glass-panel p-8 md:p-12 rounded-2xl shadow-xl bg-slate-50 border border-slate-200">
                            {isSuccess ? (
                                <div className="text-center py-12 fade-in">
                                    <CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-6" />
                                    <h3 className="font-playfair text-3xl text-slate-800 mb-4">Thank You!</h3>
                                    <p className="text-slate-600">
                                        {formData.attending === 'yes' 
                                            ? "We can't wait to celebrate with you!" 
                                            : "We will miss you, thank you for letting us know."}
                                    </p>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-6 fade-in">
                                    {errorMsg && <div className="p-4 bg-red-50 text-red-600 rounded-lg text-sm">{errorMsg}</div>}
                                    
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                                            <input type="text" name="name" required value={formData.name} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all" placeholder="John & Jane Doe" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                                            <input type="email" name="email" required value={formData.email} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all" placeholder="john@example.com" />
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Will you attend?</label>
                                            <select name="attending" value={formData.attending} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all bg-white">
                                                <option value="yes">Joyfully Accept</option>
                                                <option value="no">Regretfully Decline</option>
                                            </select>
                                        </div>

                                        {formData.attending === 'yes' && (
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Total Guests</label>
                                                <div className="flex items-center w-full p-1 rounded-lg border border-slate-300 bg-white focus-within:ring-2 focus-within:ring-slate-400 focus-within:border-slate-400 transition-all">
                                                    <button type="button" onClick={() => setFormData(prev => ({...prev, guests: Math.max(1, parseInt(prev.guests || 1) - 1).toString()}))} className="w-10 h-10 rounded-md hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors font-bold text-lg">-</button>
                                                    <input type="number" name="guests" value={formData.guests} onChange={handleChange} min="1" className="flex-1 text-center font-medium text-slate-800 outline-none bg-transparent" />
                                                    <button type="button" onClick={() => setFormData(prev => ({...prev, guests: (parseInt(prev.guests || 1) + 1).toString()}))} className="w-10 h-10 rounded-md hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors font-bold text-lg">+</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {formData.attending === 'yes' && (
                                        <div className="p-6 bg-slate-100 rounded-xl border border-slate-200 mt-4">
                                            <h4 className="font-cinzel text-sm font-bold tracking-widest uppercase mb-4 text-slate-800">Meal Details</h4>
                                            
                                            <div className="mb-4">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Entrée Selection (per guest)</label>
                                                <select name="meal" value={formData.meal} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all bg-white">
                                                    <option value="beef">Filet Mignon</option>
                                                    <option value="chicken">Roasted Chicken</option>
                                                    <option value="fish">Atlantic Salmon</option>
                                                    <option value="vegetarian">Vegetarian Risotto</option>
                                                </select>
                                                <p className="text-xs text-slate-500 mt-1">If multiple guests have different choices, please specify in the notes below.</p>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Dietary Restrictions & Notes</label>
                                                <textarea name="dietary" rows="2" value={formData.dietary} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all bg-white resize-none" placeholder="Allergies, multiple meal selections..."></textarea>
                                            </div>
                                        </div>
                                    )}

                                    <button type="submit" disabled={isSubmitting} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-lg font-cinzel text-sm tracking-widest uppercase transition-all shadow-lg hover:shadow-xl disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center mt-8">
                                        {isSubmitting ? 'Sending...' : 'Send RSVP'}
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================

        function AdminDashboard() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [rsvps, setRsvps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            // Check Auth State
            useEffect(() => {
                if (window.firebaseAuth) {
                    const unsubscribe = onAuthStateChanged(window.firebaseAuth, (currentUser) => {
                        setUser(currentUser);
                        setLoading(false);
                        if (currentUser) fetchRsvps();
                    });
                    return () => unsubscribe();
                } else {
                    setLoading(false);
                    setError("Firebase is not configured. Edit the index.html file to add your config.");
                }
            }, []);

            const fetchRsvps = () => {
                if (!window.firebaseDb) return;
                const rsvpRef = ref(window.firebaseDb, 'rsvps');
                onValue(rsvpRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const rsvpList = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        // Sort newest first
                        rsvpList.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                        setRsvps(rsvpList);
                    } else {
                        setRsvps([]);
                    }
                });
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    await signInWithEmailAndPassword(window.firebaseAuth, email, password);
                } catch (err) {
                    setError("Invalid credentials. Please check your email and password.");
                }
            };

            const handleLogout = async () => {
                await signOut(window.firebaseAuth);
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-50">Loading...</div>;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 font-montserrat">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
                            <div className="text-center mb-8">
                                <Lock className="w-12 h-12 text-slate-800 mx-auto mb-4" />
                                <h1 className="text-2xl font-playfair text-slate-800 font-bold">Admin Login</h1>
                                <p className="text-slate-500 text-sm">Sign in to view RSVPs</p>
                            </div>
                            
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4">{error}</div>}
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                                    <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 outline-none" />
                                </div>
                                <button type="submit" className="w-full bg-slate-800 text-white py-3 rounded-lg hover:bg-slate-700 transition font-medium">Sign In</button>
                            </form>
                            <div className="mt-6 text-center">
                                <a href="#" className="text-sm text-slate-500 hover:text-slate-800 underline">Return to Website</a>
                            </div>
                        </div>
                    </div>
                );
            }

            // Stats
            const totalYes = rsvps.filter(r => r.attending === 'yes').reduce((acc, curr) => acc + parseInt(curr.guests || 0), 0);
            const totalNo = rsvps.filter(r => r.attending === 'no').length;

            return (
                <div className="min-h-screen bg-slate-50 font-montserrat p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800">RSVP Dashboard</h1>
                                <p className="text-slate-500 text-sm">Real-time attendance tracking</p>
                            </div>
                            <button onClick={handleLogout} className="flex items-center space-x-2 text-slate-600 hover:text-slate-900 bg-slate-100 px-4 py-2 rounded-lg">
                                <LogOut className="w-4 h-4" />
                                <span>Sign Out</span>
                            </button>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                                <div className="p-3 bg-blue-50 text-blue-600 rounded-xl"><Users className="w-6 h-6" /></div>
                                <div><p className="text-slate-500 text-sm font-medium">Total Responses</p><p className="text-2xl font-bold">{rsvps.length}</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                                <div className="p-3 bg-green-50 text-green-600 rounded-xl"><CheckCircle className="w-6 h-6" /></div>
                                <div><p className="text-slate-500 text-sm font-medium">Total Attending (Guests)</p><p className="text-2xl font-bold">{totalYes}</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                                <div className="p-3 bg-red-50 text-red-600 rounded-xl"><Lock className="w-6 h-6" /></div>
                                <div><p className="text-slate-500 text-sm font-medium">Not Attending</p><p className="text-2xl font-bold">{totalNo}</p></div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200">
                                            <th className="p-4 font-semibold text-sm text-slate-600">Date</th>
                                            <th className="p-4 font-semibold text-sm text-slate-600">Name</th>
                                            <th className="p-4 font-semibold text-sm text-slate-600">Status</th>
                                            <th className="p-4 font-semibold text-sm text-slate-600">Guests</th>
                                            <th className="p-4 font-semibold text-sm text-slate-600">Meal</th>
                                            <th className="p-4 font-semibold text-sm text-slate-600">Notes</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {rsvps.length === 0 ? (
                                            <tr><td colSpan="6" className="p-8 text-center text-slate-500">No RSVPs yet.</td></tr>
                                        ) : (
                                            rsvps.map(rsvp => (
                                                <tr key={rsvp.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="p-4 text-sm text-slate-500">{new Date(rsvp.timestamp).toLocaleDateString()}</td>
                                                    <td className="p-4 font-medium text-slate-800">
                                                        {rsvp.name}
                                                        <div className="text-xs text-slate-400 font-normal">{rsvp.email}</div>
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-medium ${rsvp.attending === 'yes' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                            {rsvp.attending === 'yes' ? 'Attending' : 'Declined'}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-sm text-slate-600">{rsvp.attending === 'yes' ? rsvp.guests : '-'}</td>
                                                    <td className="p-4 text-sm text-slate-600 capitalize">{rsvp.attending === 'yes' ? rsvp.meal : '-'}</td>
                                                    <td className="p-4 text-sm text-slate-600 max-w-xs truncate" title={rsvp.dietary}>{rsvp.dietary || '-'}</td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // MAIN APP COMPONENT / ROUTER
        // ==========================================

        function App() {
            const [isAdminRoute, setIsAdminRoute] = useState(window.location.hash === '#admin');

            useEffect(() => {
                const handleHashChange = () => setIsAdminRoute(window.location.hash === '#admin');
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            if (isAdminRoute) {
                return <AdminDashboard />;
            }

            return (
                <div className="font-montserrat text-slate-800 antialiased selection:bg-slate-200 selection:text-slate-900">
                    <nav className="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-slate-100 hidden md:block shadow-sm">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-center space-x-8">
                            <a href="#" className="font-cinzel text-xs font-bold tracking-widest text-slate-600 hover:text-slate-900 uppercase">Home</a>
                            <a href="#schedule" className="font-cinzel text-xs font-bold tracking-widest text-slate-600 hover:text-slate-900 uppercase">Schedule</a>
                            <a href="#travel" className="font-cinzel text-xs font-bold tracking-widest text-slate-600 hover:text-slate-900 uppercase">Details</a>
                            <a href="#rsvp" className="font-cinzel text-xs font-bold tracking-widest text-slate-600 hover:text-slate-900 uppercase">RSVP</a>
                        </div>
                    </nav>

                    <HeroSection />
                    <ScheduleSection />
                    <DetailsTravelSection />
                    <RsvpSection />
                    
                    <footer className="bg-slate-900 py-12 text-center text-slate-400">
                        <p className="font-cinzel text-xs tracking-[0.3em] uppercase mb-4 text-slate-300">
                            Rishi & Marilyn
                        </p>
                        <p className="text-xs mb-8">September 19, 2026</p>
                        <a href="#admin" className="text-[10px] uppercase tracking-widest opacity-50 hover:opacity-100 transition-opacity">Admin Login</a>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
