        function RsvpSection() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                phone: '',
                attending: 'yes',
                plusOnes: '0',
                plusOneName1: '',
                plusOneName2: '',
                attendingCeremony: true,
                attendingCocktail: true,
                attendingReception: true,
                dietary: ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (name === 'attending' && value === 'no') {
                    setFormData(prev => ({ 
                        ...prev, 
                        attending: 'no', 
                        plusOnes: '0', 
                        plusOneName1: '', 
                        plusOneName2: '' 
                    }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
                }
            };

            const postToFirebaseRest = async (data, timeoutMs = 8000) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const response = await fetch("https://rishi-wedding-default-rtdb.firebaseio.com/rsvps.json", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (!response.ok) {
                        throw new Error("Server returned HTTP " + response.status);
                    }
                    return await response.json();
                } catch (err) {
                    clearTimeout(timeoutId);
                    throw err;
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setErrorMsg('');
                
                try {
                    const plusOnesCount = formData.attending === 'yes' ? parseInt(formData.plusOnes || 0) : 0;
                    const submitData = {
                        ...formData,
                        plusOnes: plusOnesCount.toString(),
                        plusOneName1: plusOnesCount > 0 ? formData.plusOneName1 : '',
                        plusOneName2: plusOnesCount > 1 ? formData.plusOneName2 : '',
                        attendingCeremony: formData.attending === 'yes' ? formData.attendingCeremony : false,
                        attendingCocktail: formData.attending === 'yes' ? formData.attendingCocktail : false,
                        attendingReception: formData.attending === 'yes' ? formData.attendingReception : false,
                        guests: formData.attending === 'yes' ? (1 + plusOnesCount) : 0,
                        timestamp: new Date().toISOString()
                    };

                    let saved = false;

                    // 1. Direct fast HTTPS REST POST (reliable on all mobile browsers, works with ad blockers & spotty signal)
                    try {
                        await postToFirebaseRest(submitData, 8000);
                        saved = true;
                    } catch (restErr) {
                        console.warn("Direct REST save failed, attempting SDK save:", restErr);
                    }

                    // 2. Fallback to Firebase SDK push if REST failed, with an explicit 8s timeout
                    if (!saved) {
                        const sdkPromise = (async () => {
                            if (window.firebasePromise) {

        function AdminDashboard() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [rsvps, setRsvps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            // Check Auth State
            useEffect(() => {
                let unsubscribe = () => {};
                let isMounted = true;

                const setupAuth = async () => {
                    if (window.firebasePromise) {
                        await window.firebasePromise;
                    }
                    if (!isMounted) return;

                    if (window.firebaseAuth && window.firebaseAuthFunctions?.onAuthStateChanged) {
                        unsubscribe = window.firebaseAuthFunctions.onAuthStateChanged(window.firebaseAuth, (currentUser) => {
                            if (!isMounted) return;
                            if (currentUser) {
                                setUser(currentUser);
                                fetchRsvps();
                            } else {
                                setUser(prev => (prev && prev.isFallback ? prev : null));
                            }
                            setLoading(false);
                        });
                    } else {
                        setLoading(false);
                    }
                };

                setupAuth();

                return () => {
                    isMounted = false;
                    unsubscribe();
                };
            }, []);

            const fetchRsvps = async () => {
                // 1. Fetch immediately via HTTPS REST endpoint
                try {
                    const res = await fetch("https://rishi-wedding-default-rtdb.firebaseio.com/rsvps.json");
                    if (res.ok) {
                        const data = await res.json();
                        if (data) {
                            const rsvpList = Object.keys(data).map(key => ({
                                id: key,
                                ...data[key]
                            }));
                            rsvpList.sort((a,b) => {
                                const dateA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                                const dateB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                                return dateB - dateA;
                            });
                            setRsvps(rsvpList);
                        } else {
                            setRsvps([]);
                        }
                    }
                } catch (restErr) {
                    console.warn("Direct REST fetch for RSVPs failed:", restErr);
                }

                // 2. Attach realtime database listener if SDK is available
                try {
                    if (window.firebasePromise) {
                        await window.firebasePromise;
                    }
                    if (!window.firebaseDb || !window.firebaseDbFunctions?.ref || !window.firebaseDbFunctions?.onValue) return;
                    const { ref: dbRef, onValue: dbOnValue } = window.firebaseDbFunctions;
                    const rsvpRef = dbRef(window.firebaseDb, 'rsvps');
                    dbOnValue(rsvpRef, (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const rsvpList = Object.keys(data).map(key => ({
                                id: key,
                                ...data[key]
                            }));
                            rsvpList.sort((a,b) => {
                                const dateA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                                const dateB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                                return dateB - dateA;
                            });
                            setRsvps(rsvpList);
                        } else {
                            setRsvps([]);
                        }
                    }, (error) => {
                        console.error("Realtime listener error:", error);
                    });
                } catch (sdkErr) {
                    console.warn("Firebase SDK realtime listener setup failed:", sdkErr);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                const lowerEmail = email.toLowerCase();

                try {
                    if (window.firebasePromise) {
                        await window.firebasePromise;
                    }
                    if (window.firebaseAuth && window.firebaseAuthFunctions?.signInWithEmailAndPassword) {
                        // Attempt real Firebase authentication first
                        await window.firebaseAuthFunctions.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                    } else {
                        throw new Error("Firebase Auth is not initialized.");
                    }
                } catch (err) {
                    console.warn("Firebase Auth sign-in failed, checking fallback:", err);
                    // Check if credentials match the fallback bypass
                    if ((lowerEmail === 'admin@rishiwedding.com' || lowerEmail === 'marilynandrishi@gmail.com') && password === 'wedding2026') {
                        const fallbackUser = { email: lowerEmail, isFallback: true };
                        setUser(fallbackUser);
                        fetchRsvps();
                    } else {
                        setError("Invalid credentials. Please check your email and password.");
                    }
                }
            };

            const handleLogout = async () => {
                if (window.firebasePromise) {
                    await window.firebasePromise;
                }
                if (user && user.isFallback) {
                    setUser(null);
                } else if (window.firebaseAuth && window.firebaseAuthFunctions?.signOut) {
                    await window.firebaseAuthFunctions.signOut(window.firebaseAuth);

                                                            {rsvp.dietary || '-'}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CountdownSection() {
            const targetDate = new Date(2026, 8, 19, 14, 0, 0).getTime();
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, isOver: false });

            useEffect(() => {
                const calculateTime = () => {
                    const now = new Date().getTime();
                    const difference = targetDate - now;

                    if (difference <= 0) {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, isOver: true });
                        return;
                    }

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                    setTimeLeft({ days, hours, minutes, seconds, isOver: false });
                };

                calculateTime();
                const interval = setInterval(calculateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            if (timeLeft.isOver) {
                return (
                    <div className="py-16 bg-slate-50 text-center border-t border-slate-100">
                        <h3 className="font-playfair text-3xl italic text-slate-800">The Celebration is Here!</h3>
                    </div>
                );
            }

            return (
                <div className="py-16 bg-slate-50 border-t border-slate-100 relative overflow-hidden">
                    <div className="max-w-4xl mx-auto text-center relative z-10 px-4">
                        <h2 className="font-playfair text-3xl text-slate-800 italic mb-8">Counting Down to the Big Day</h2>
                        <div className="grid grid-cols-4 gap-4 max-w-lg mx-auto">
                            {[
                                { label: "Days", value: timeLeft.days },
                                { label: "Hours", value: timeLeft.hours },
                                { label: "Minutes", value: timeLeft.minutes },
                                { label: "Seconds", value: timeLeft.seconds }
                            ].map((item, idx) => (
                                <div key={idx} className="glass-panel p-4 rounded-xl flex flex-col justify-center items-center shadow-sm">
                                    <span className="font-playfair text-3xl md:text-4xl text-slate-800 font-bold">{String(item.value).padStart(2, '0')}</span>
                                    <span className="font-cinzel text-[10px] text-slate-500 uppercase tracking-wider mt-1">{item.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function MusicPlayer() {
            const [isPlaying, setIsPlaying] = useState(false);
            const playerRef = useRef(null);
            const userPausedRef = useRef(false);

            useEffect(() => {
                let player;
                
                const loadYT = () => {
                    if (!window.YT) {
                        const tag = document.createElement('script');
                        tag.src = "https://www.youtube.com/iframe_api";
                        const firstScriptTag = document.getElementsByTagName('script')[0];
                        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    }
                    
                    const checkAndInit = () => {
                        if (window.YT && window.YT.Player) {
                            initPlayer();
                        } else {
                            setTimeout(checkAndInit, 100);
                        }
                    };
                    checkAndInit();
                };

                const initPlayer = () => {
                    try {
                        player = new window.YT.Player('yt-player', {
                            height: '0',
                            width: '0',
                            videoId: 'zqm8hK1mvjc',
                            playerVars: {
                                playsinline: 1,
                                loop: 1,
                                playlist: 'zqm8hK1mvjc',
                                controls: 0,
                                showinfo: 0,
                                rel: 0
                            },
                            events: {
                                onReady: (event) => {
                                    event.target.playVideo();
                                },
                                onStateChange: (event) => {
                                    if (event.data === window.YT.PlayerState.PLAYING) {
                                        setIsPlaying(true);
                                    } else if (event.data === window.YT.PlayerState.PAUSED) {
                                        setIsPlaying(false);
                                    }
                                }
                            }
                        });
                        playerRef.current = player;
                    } catch (e) {
                        console.error("YT init error", e);
                    }
                };

                loadYT();

                // Autoplay trigger on user interaction
                const startAutoplay = () => {
                    if (userPausedRef.current) return;
                    if (playerRef.current && typeof playerRef.current.playVideo === 'function') {
                        try {
                            const state = playerRef.current.getPlayerState();
                            if (state !== 1) {
                                playerRef.current.playVideo();
                            }
                        } catch (e) {
                            playerRef.current.playVideo();
                        }
                    }
                };

                document.addEventListener('click', startAutoplay);
                document.addEventListener('touchstart', startAutoplay);
                document.addEventListener('scroll', startAutoplay);

                return () => {
                    document.removeEventListener('click', startAutoplay);
                    document.removeEventListener('touchstart', startAutoplay);
                    document.removeEventListener('scroll', startAutoplay);
                    if (player && typeof player.destroy === 'function') {
                        player.destroy();
                    }
                };
            }, []);

            const togglePlay = () => {
                if (!playerRef.current || typeof playerRef.current.playVideo !== 'function') return;
                if (isPlaying) {
                    playerRef.current.pauseVideo();
                    setIsPlaying(false);
                    userPausedRef.current = true;
                } else {
                    playerRef.current.playVideo();
                    setIsPlaying(true);
                    userPausedRef.current = false;
                }
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-2">
                    <div id="yt-player" className="hidden"></div>
                    {!isPlaying && (
                        <div className="hidden md:block bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] uppercase tracking-widest font-semibold px-3 py-2 rounded-full border border-slate-200 shadow-md">
                            🎵 Play Music
                        </div>
                    )}
                    <button
                        onClick={togglePlay}
                        className={`flex items-center justify-center w-12 h-12 rounded-full shadow-lg border transition-all duration-300 ${isPlaying ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'}`}
                        title={isPlaying ? "Pause Music" : "Play Music"}
                    >
                        {isPlaying ? (
                            <div className="flex items-end justify-center space-x-0.5 h-4 w-4">
                                <span className="w-0.5 h-3 bg-white rounded-full animate-bounce-bar1"></span>
                                <span className="w-0.5 h-4 bg-white rounded-full animate-bounce-bar2"></span>
                                <span className="w-0.5 h-2 bg-white rounded-full animate-bounce-bar3"></span>
                            </div>
                        ) : (
                            <Music size={20} className="text-slate-600 animate-pulse" />
                        )}
                    </button>
                </div>
            );
        }
