        function RsvpSection() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                phone: '',
                attending: 'yes',
                plusOnes: '0',
                plusOneName1: '',
                plusOneName2: '',
                dietary: ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setErrorMsg('');
                
                try {
                    if (window.firebaseDb) {
                        const rsvpRef = ref(window.firebaseDb, 'rsvps');
                        await push(rsvpRef, {
                            ...formData,
                            guests: 1 + parseInt(formData.plusOnes || 0), // Maintain total guests count for compatibility in Dashboard
                            timestamp: new Date().toISOString()
                        });
                        setIsSuccess(true);
                    } else {
                        // Mock submission if Firebase is not configured
                        console.warn("Firebase not configured. Mocking submission.");
                        setTimeout(() => setIsSuccess(true), 1000);
                    }
                } catch (error) {
                    console.error("Error submitting RSVP:", error);
                    setErrorMsg("There was an error saving your RSVP. Please try again.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div id="rsvp" className="py-24 px-4 bg-transparent relative overflow-hidden">
                    <div className="absolute bottom-0 left-0 w-full opacity-40 pointer-events-none transform rotate-180 z-0">
                        <img src="./garland.png" alt="" className="w-full h-[200px] object-cover object-top" />
                    </div>

                    <div className="max-w-2xl mx-auto relative z-10">

                            <p className="font-cinzel text-xs tracking-widest text-slate-800 uppercase font-bold mb-2">Kindly Respond by Sunday, July 19th 2026</p>
                            <p className="font-playfair text-sm text-slate-600 italic mt-2">“We respectfully request an adults-only celebration.”</p>
                        </div>

                        <div className="glass-panel p-8 md:p-12 rounded-2xl shadow-xl bg-slate-50 border border-slate-200">
                            {isSuccess ? (
                                <div className="text-center py-12 fade-in">
                                    <CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-6" />
                                    <h3 className="font-playfair text-3xl text-slate-800 mb-4">Thank You!</h3>
                                    <p className="text-slate-600">
                                        {formData.attending === 'yes' 
                                            ? "We can't wait to celebrate with you!" 
                                            : "We will miss you, thank you for letting us know."}
                                    </p>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-6 fade-in">
                                    {errorMsg && <div className="p-4 bg-red-50 text-red-600 rounded-lg text-sm">{errorMsg}</div>}
                                    
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div className="md:col-span-2">
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                                            <input type="text" name="name" required value={formData.name} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all" placeholder="John & Jane Doe" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                                            <input type="email" name="email" required value={formData.email} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all" placeholder="john@example.com" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                                            <input type="tel" name="phone" required value={formData.phone} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all" placeholder="(555) 555-5555" />
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Will you attend?</label>
                                            <select name="attending" value={formData.attending} onChange={handleChange} className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-400 focus:border-slate-400 outline-none transition-all bg-white">
                                                <option value="yes">Joyfully Accept</option>
                                                <option value="no">Regretfully Decline</option>
                                            </select>
                                        </div>

                                        {formData.attending === 'yes' && (
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Plus One(s)</label>
                                                <div className="flex items-center w-full p-1 rounded-lg border border-slate-300 bg-white focus-within:ring-2 focus-within:ring-slate-400 focus-within:border-slate-400 transition-all">
                                                    <button 
                                                        type="button" 
                                                        onClick={() => setFormData(prev => ({...prev, plusOnes: Math.max(0, parseInt(prev.plusOnes || 0) - 1).toString()}))} 
                                                        className="w-10 h-10 rounded-md hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors font-bold text-lg"
                                                    >-</button>
                                                    <input 
                                                        type="text" 
                                                        readOnly 
                                                        name="plusOnes" 
                                                        value={formData.plusOnes} 
                                                        className="flex-1 text-center font-medium text-slate-800 outline-none bg-transparent cursor-default" 
                                                    />
                                                    <button 
                                                        type="button" 
                                                        onClick={() => setFormData(prev => ({...prev, plusOnes: Math.min(2, parseInt(prev.plusOnes || 0) + 1).toString()}))} 
                                                        className="w-10 h-10 rounded-md hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors font-bold text-lg"
                                                    >+</button>
                                                </div>
                                                <p className="text-xs text-slate-500 mt-1">Select up to 2 additional guests.</p>
                                            </div>

        function CountdownSection() {
            const targetDate = new Date("2026-09-19T14:00:00").getTime();
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, isOver: false });

            useEffect(() => {
                const calculateTime = () => {
                    const now = new Date().getTime();
                    const difference = targetDate - now;

                    if (difference <= 0) {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, isOver: true });
                        return;
                    }

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                    setTimeLeft({ days, hours, minutes, seconds, isOver: false });
                };

                calculateTime();
                const interval = setInterval(calculateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            if (timeLeft.isOver) {
                return (
                    <div className="py-16 bg-slate-50 text-center border-t border-slate-100">
                        <h3 className="font-playfair text-3xl italic text-slate-800">The Celebration is Here!</h3>
                    </div>
                );
            }

            return (
                <div className="py-16 bg-slate-50 border-t border-slate-100 relative overflow-hidden">
                    <div className="max-w-4xl mx-auto text-center relative z-10 px-4">
                        <h2 className="font-playfair text-3xl text-slate-800 italic mb-8">Counting Down to the Big Day</h2>
                        <div className="grid grid-cols-4 gap-4 max-w-lg mx-auto">
                            {[
                                { label: "Days", value: timeLeft.days },
                                { label: "Hours", value: timeLeft.hours },
                                { label: "Minutes", value: timeLeft.minutes },
                                { label: "Seconds", value: timeLeft.seconds }
                            ].map((item, idx) => (
                                <div key={idx} className="glass-panel p-4 rounded-xl flex flex-col justify-center items-center shadow-sm">

                    </div>
                </div>
            );
        }

        function MusicPlayer() {
            const [isPlaying, setIsPlaying] = useState(false);
            const playerRef = useRef(null);
            const userPausedRef = useRef(false);

            useEffect(() => {
                let player;
                
                const loadYT = () => {
                    if (!window.YT) {
                        const tag = document.createElement('script');
                        tag.src = "https://www.youtube.com/iframe_api";
                        const firstScriptTag = document.getElementsByTagName('script')[0];
                        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    }
                    
                    const checkAndInit = () => {
                        if (window.YT && window.YT.Player) {
                            initPlayer();
                        } else {
                            setTimeout(checkAndInit, 100);
                        }
                    };
                    checkAndInit();
                };

                const initPlayer = () => {
                    try {
                        player = new window.YT.Player('yt-player', {
                            height: '0',
                            width: '0',
                            videoId: 'zqm8hK1mvjc',
                            playerVars: {
                                playsinline: 1,
                                loop: 1,
                                playlist: 'zqm8hK1mvjc',
                                controls: 0,
                                showinfo: 0,
                                rel: 0
                            },
                            events: {
                                onReady: (event) => {
                                    event.target.playVideo();
                                },
                                onStateChange: (event) => {
                                    if (event.data === window.YT.PlayerState.PLAYING) {
                                        setIsPlaying(true);
                                    } else if (event.data === window.YT.PlayerState.PAUSED) {
                                        setIsPlaying(false);
                                    }
                                }
                            }
                        });
                        playerRef.current = player;
                    } catch (e) {
                        console.error("YT init error", e);
                    }
                };

                loadYT();

                // Autoplay trigger on user interaction
                const startAutoplay = () => {
                    if (userPausedRef.current) return;
                    if (playerRef.current && typeof playerRef.current.playVideo === 'function') {
                        try {
                            const state = playerRef.current.getPlayerState();
                            if (state !== 1) {
                                playerRef.current.playVideo();
                            }
                        } catch (e) {
                            playerRef.current.playVideo();
                        }
                    }
                };

                document.addEventListener('click', startAutoplay);
                document.addEventListener('touchstart', startAutoplay);
                document.addEventListener('scroll', startAutoplay);

                return () => {
                    document.removeEventListener('click', startAutoplay);
                    document.removeEventListener('touchstart', startAutoplay);
                    document.removeEventListener('scroll', startAutoplay);
                    if (player && typeof player.destroy === 'function') {
                        player.destroy();
                    }
                };
            }, []);

            const togglePlay = () => {
                if (!playerRef.current || typeof playerRef.current.playVideo !== 'function') return;
                if (isPlaying) {
                    playerRef.current.pauseVideo();
                    setIsPlaying(false);
                    userPausedRef.current = true;
                } else {
                    playerRef.current.playVideo();
                    setIsPlaying(true);
                    userPausedRef.current = false;
                }
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-2">
                    <div id="yt-player" className="hidden"></div>
                    {!isPlaying && (
                        <div className="hidden md:block bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] uppercase tracking-widest font-semibold px-3 py-2 rounded-full border border-slate-200 shadow-md">
                            🎵 Play Music
                        </div>
                    )}
                    <button
                        onClick={togglePlay}
                        className={`flex items-center justify-center w-12 h-12 rounded-full shadow-lg border transition-all duration-300 ${isPlaying ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'}`}
                        title={isPlaying ? "Pause Music" : "Play Music"}
                    >
                        {isPlaying ? (
                            <div className="flex items-end justify-center space-x-0.5 h-4 w-4">
                                <span className="w-0.5 h-3 bg-white rounded-full animate-bounce-bar1"></span>
                                <span className="w-0.5 h-4 bg-white rounded-full animate-bounce-bar2"></span>
                                <span className="w-0.5 h-2 bg-white rounded-full animate-bounce-bar3"></span>
                            </div>
                        ) : (
                            <Music size={20} className="text-slate-600 animate-pulse" />
                        )}
                    </button>
                </div>
            );
        }
